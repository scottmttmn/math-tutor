// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        // Onyx's pen SDK for BOOX tablets (BooxPenPlugin) is only published here, and only over http,
        // so this repository may serve Onyx's packages and the few old ones they need that left
        // Maven Central's reach with JCenter, and nothing else.
        maven {
            url "http://repo.boox.com/repository/maven-public/"
            allowInsecureProtocol = true
            content {
                includeGroupByRegex "com\\.onyx\\..*"
                includeGroup "pub.devrel"
                includeGroup "com.tencent"
                includeGroup "com.jakewharton.hugo.fix"
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
