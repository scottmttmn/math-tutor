name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      # The browser tests use a mock model provider, so no API keys are needed.
      - name: Browser tests against the production build
        run: |
          npm run start -- -p 3100 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3100/ && break; sleep 1; done
          npm run test:e2e

      - name: Server log
        if: failure()
        run: cat server.log || true
